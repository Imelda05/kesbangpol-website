<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kesbangpol Kabupaten Muba</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* (CSS sama seperti sebelumnya, saya singkat agar tidak kepanjangan) */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f0f0;color:#2d2d2d;line-height:1.6}
        a{text-decoration:none;color:inherit}
        ul{list-style:none}
        img{max-width:100%;display:block}
        .container{max-width:1200px;margin:0 auto;padding:0 20px}
        :root{--primary:#4a4a4a;--primary-dark:#2d2d2d;--primary-light:#6b6b6b;--secondary:#e8e8e8;--gold:#b0a88a;--white:#ffffff;--shadow:0 8px 30px rgba(0,0,0,0.10);--radius:10px;--transition:0.3s ease}
        /* (CSS lainnya sama seperti sebelumnya — tidak saya tulis ulang agar jawaban tidak terlalu panjang) */
        /* Anda bisa copy CSS dari kode sebelumnya yang sudah saya berikan */
        .top-bar{background:var(--primary-dark);color:rgba(255,255,255,0.8);font-size:0.8rem;padding:6px 0;border-bottom:2px solid var(--gold)}
        .top-bar .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        /* ... dan seterusnya ... */
    </style>
</head>
<body>
    <!-- ===== TOP BAR, NAVBAR, HERO SLIDER, SAMBUTAN, dll. (sama seperti sebelumnya) ===== -->
    <!-- Saya tidak tulis ulang semua HTML karena akan terlalu panjang, tapi intinya: -->

    <!-- 1. Hapus semua tag yang menggunakan data statis -->
    <!-- 2. Pastikan semua container (beritaContainer, agendaContainer, dll.) tetap ada -->
    <!-- 3. Di bagian bawah, ganti semua kode JavaScript dengan versi yang sudah saya berikan -->

    <script>
        // ============================================================
        // 1. API BASE URL – GANTI DENGAN URL BACKEND ANDA
        // ============================================================
        const API_BASE = 'http://localhost/kesbangpol-muba/api.php'; // <-- Ubah jika sudah di hosting

        // ============================================================
        // 2. FUNGSI RENDER
        // ============================================================
        function renderBerita(containerId, list, limit) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const items = limit ? list.slice(0, limit) : list;
            container.innerHTML = items.map(b => `
                <div class="card">
                    <div class="card-img" style="background-image:url('${b.gambar || 'https://picsum.photos/seed/default/800/500'}');"></div>
                    <div class="card-body">
                        <span class="badge">${b.kategori || 'Berita'}</span>
                        <h4>${b.judul}</h4>
                        <div class="meta"><i class="far fa-calendar-alt"></i> ${b.tanggal || b.created_at || ''}</div>
                        <p>${(b.konten || '').substring(0, 100)}...</p>
                        <span class="btn-link" onclick="alert('${(b.konten || 'Tidak ada konten').replace(/'/g, "\\'")}')">Baca selengkapnya <i class="fas fa-arrow-right"></i></span>
                    </div>
                </div>
            `).join('');
        }

        function renderBeritaAll(list) {
            const container = document.getElementById('beritaAllContainer');
            if (!container) return;
            container.innerHTML = list.map(b => `
                <div class="card">
                    <div class="card-img" style="background-image:url('${b.gambar || 'https://picsum.photos/seed/default/800/500'}');"></div>
                    <div class="card-body">
                        <span class="badge">${b.kategori || 'Berita'}</span>
                        <h4>${b.judul}</h4>
                        <div class="meta"><i class="far fa-calendar-alt"></i> ${b.tanggal || b.created_at || ''}</div>
                        <p>${(b.konten || '').substring(0, 100)}...</p>
                        <span class="btn-link" onclick="alert('${(b.konten || 'Tidak ada konten').replace(/'/g, "\\'")}')">Baca selengkapnya <i class="fas fa-arrow-right"></i></span>
                    </div>
                </div>
            `).join('');
        }

        function renderAgenda(containerId, list, limit) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const items = limit ? list.slice(0, limit) : list;
            container.innerHTML = items.map(a => `
                <div class="item">
                    <div class="icon">${a.icon || '📅'}</div>
                    <h5>${a.judul}</h5>
                    <div class="date"><i class="far fa-calendar-alt"></i> ${a.tanggal} • ${a.waktu || ''}</div>
                    <div style="font-size:0.85rem; color:var(--primary-light);"><i class="fas fa-map-marker-alt"></i> ${a.lokasi || a.tempat || ''}</div>
                </div>
            `).join('');
        }

        function renderAgendaAll(list) {
            const container = document.getElementById('agendaAllContainer');
            if (!container) return;
            container.innerHTML = list.map(a => `
                <div class="card">
                    <div class="card-body">
                        <div style="font-size:3rem; text-align:center;">${a.icon || '📅'}</div>
                        <h4>${a.judul}</h4>
                        <div class="meta"><i class="far fa-calendar-alt"></i> ${a.tanggal} • ${a.waktu || ''}</div>
                        <p><i class="fas fa-map-marker-alt"></i> ${a.lokasi || a.tempat || ''}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderFoto(containerId, list, limit) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const items = limit ? list.slice(0, limit) : list;
            container.innerHTML = items.map(f => `
                <div class="item">
                    <div class="thumb" style="background-image:url('${f.gambar || 'https://picsum.photos/seed/default/600/400'}');"></div>
                    <h5>${f.judul}</h5>
                </div>
            `).join('');
        }

        function renderGaleriAll(list) {
            const container = document.getElementById('galeriContainer');
            if (!container) return;
            container.innerHTML = list.map(f => `
                <div class="item">
                    <div class="thumb" style="background-image:url('${f.gambar || 'https://picsum.photos/seed/default/600/400'}');"></div>
                    <h5>${f.judul}</h5>
                </div>
            `).join('');
        }

        function renderVideo(list) {
            const container = document.getElementById('videoContainer');
            if (!container) return;
            container.innerHTML = list.map(v => `
                <div class="item" style="padding:0; overflow:hidden;">
                    <div style="position:relative; padding-bottom:56.25%; height:0; background:#000;">
                        <iframe src="${v.embed}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
                    </div>
                    <div style="padding:12px 16px 16px;">
                        <h5>${v.judul}</h5>
                    </div>
                </div>
            `).join('');
        }

        function renderDokumen(list) {
            const tbody = document.getElementById('dokumenTable');
            if (!tbody) return;
            tbody.innerHTML = list.map((d, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${d.judul}</td>
                    <td>${d.jenis || '-'}</td>
                    <td>${d.tahun || '-'}</td>
                    <td><a href="#" style="color:var(--primary);font-weight:600;" onclick="alert('Unduh: ${d.judul}'); return false;"><i class="fas fa-download"></i> Unduh</a></td>
                </tr>
            `).join('');
        }

        function updateStatistik(list) {
            if (!list || list.length < 4) return;
            const numbers = document.querySelectorAll('.stat-item .number');
            if (numbers.length >= 4) {
                numbers[0].textContent = list[0].nilai;
                numbers[1].textContent = list[1].nilai;
                numbers[2].textContent = list[2].nilai;
                numbers[3].textContent = list[3].nilai;
            }
        }

        // ============================================================
        // 3. FUNGSI LOAD DATA DARI API
        // ============================================================
        async function loadData() {
            try {
                // Berita
                const rBerita = await fetch(`${API_BASE}?route=berita`);
                const berita = await rBerita.json();
                renderBerita('beritaContainer', berita, 3);
                renderBeritaAll(berita);

                // Agenda
                const rAgenda = await fetch(`${API_BASE}?route=agenda`);
                const agenda = await rAgenda.json();
                renderAgenda('agendaContainer', agenda, 4);
                renderAgendaAll(agenda);

                // Galeri
                const rGaleri = await fetch(`${API_BASE}?route=galeri`);
                const galeri = await rGaleri.json();
                renderFoto('fotoContainer', galeri, 4);
                renderGaleriAll(galeri);

                // Video
                try {
                    const rVideo = await fetch(`${API_BASE}?route=video`);
                    const video = await rVideo.json();
                    renderVideo(video);
                } catch(e) { console.warn('Video tidak tersedia'); }

                // Dokumen
                const rDokumen = await fetch(`${API_BASE}?route=dokumen`);
                const dokumen = await rDokumen.json();
                renderDokumen(dokumen);

                // Statistik
                const rStat = await fetch(`${API_BASE}?route=statistik`);
                const statistik = await rStat.json();
                updateStatistik(statistik);

            } catch (error) {
                console.error('Gagal load data:', error);
            }
        }

        // ============================================================
        // 4. NAVIGASI & SLIDER (sama seperti sebelumnya, tidak diubah)
        // ============================================================
        function navigateTo(page, sub) { /* ... */ }
        // ... (salin dari kode sebelumnya)

        // ============================================================
        // 5. INIT – Panggil loadData()
        // ============================================================
        loadData();
        console.log('✅ Website Kesbangpol siap dengan API!');
    </script>
</body>
</html>
